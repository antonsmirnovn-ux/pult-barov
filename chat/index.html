<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Рабочий чат</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Рабочий чат">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="config.js"></script>
<style>
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --ink:#000; --muted:#8A8A8E; --sep:#C6C6C8; --fill:#E9E9EE;
  --accent:#E08A00; --accent-soft:#FFE7C2; --mine:#FFD9A0;
  --ok:#2DA44E; --ok-soft:#DDF5E3; --warn-ink:#8A6A00; --warn-soft:#FFF1B8; --bad:#FF3B30; --bad-soft:#FFE5E3; --link:#007AFF;
  --bar:rgba(249,249,249,.9); --dim:rgba(0,0,0,.4);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000; --cell:#1C1C1E; --ink:#FFF; --muted:#8D8D93; --sep:#38383A; --fill:#2C2C2E;
  --accent:#FFA62B; --accent-soft:#3A2A10; --mine:#5A3B0E; --ok:#30D158; --ok-soft:#12301C; --warn-ink:#FFD60A; --warn-soft:#3A3208;
  --bad:#FF453A; --bad-soft:#3B1715; --link:#0A84FF; --bar:rgba(22,22,24,.9); --dim:rgba(0,0,0,.6); color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.3 var(--f);-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:680px;margin:0 auto}

/* шапка */
header{flex:none;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;background:var(--bg);border-bottom:.5px solid var(--sep)}
.hrow{display:flex;align-items:center;gap:10px;min-height:34px}
h1{font-size:24px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net{font-size:12px;color:var(--muted)}
.net.off{color:var(--bad)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:8px}
.seg button{flex:1;padding:6px 0;border-radius:7px;font-size:15px;font-weight:600;color:var(--muted);position:relative}
.seg button.on{background:var(--cell);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dot{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:12px;line-height:18px;font-weight:700;text-align:center;margin-left:6px;vertical-align:1px}

/* лента */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 14px}
.day{text-align:center;margin:14px 0 8px}
.day span{font-size:12px;font-weight:600;color:var(--muted);background:var(--fill);padding:3px 10px;border-radius:10px}
.m{display:flex;flex-direction:column;align-items:flex-start;margin:3px 0}
.m.me{align-items:flex-end}
.b{max-width:84%;background:var(--cell);border-radius:18px;padding:7px 12px 6px;box-shadow:0 .5px 1px rgba(0,0,0,.08);-webkit-user-select:text;user-select:text}
.m.me .b{background:var(--mine)}
.who{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:1px}
.tx{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.tm{font-size:11px;color:var(--muted);text-align:right;margin-top:2px}
.ph{display:block;margin:4px -6px 2px;border-radius:12px;overflow:hidden;background:var(--fill);min-height:120px;min-width:200px;position:relative}
.ph img{display:block;width:100%;max-height:340px;object-fit:cover}
.ph .ld{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--muted)}
.st{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:10px;background:var(--fill);color:var(--muted)}
.st.open{background:var(--accent-soft);color:var(--accent)}
.st.moved{background:var(--warn-soft);color:var(--warn-ink)}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.skip,.st.gone{background:var(--fill);color:var(--muted)}
.m.me .st{background:var(--cell)}
.m.me .st.done{color:var(--ok)}
.prob .b{border-left:4px solid var(--accent)}
.prob.done .b{border-left-color:var(--ok)}
.prob.skip .b,.prob.gone .b{border-left-color:var(--sep)}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.pend{opacity:.6}
.fail .tm{color:var(--bad)}
.tm a{color:var(--link);text-decoration:none;margin-left:6px}
.upd{display:block;width:100%;margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:14px;text-align:left}

/* ввод */
.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 10px;background:var(--bar);border-top:.5px solid var(--sep);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.composer textarea{flex:1;min-height:38px;max-height:140px;resize:none;border:1px solid var(--sep);border-radius:19px;padding:8px 14px;background:var(--cell);outline:none;line-height:1.3}
.ib{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--accent)}
.ib svg{width:26px;height:26px}
.send{background:var(--accent);color:#fff}
.send svg{width:20px;height:20px}
.send:disabled{opacity:.35}
.bigbtn{flex:1;height:46px;border-radius:13px;background:var(--accent);color:#fff;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.bigbtn svg{width:22px;height:22px}
.prevw{flex:none;padding:8px 10px 0;background:var(--bar);display:flex;align-items:center;gap:8px;overflow-x:auto}
.att{flex:none;display:inline-flex;align-items:center;gap:6px;max-width:220px;padding:4px 4px 4px 4px;border-radius:12px;background:var(--cell);border:.5px solid var(--sep);font-size:13px}
.att img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.att i{font-style:normal;font-size:22px;width:32px;text-align:center}
.att .an{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
.att button{flex:none;width:30px;height:30px;border-radius:50%;color:var(--bad);font-size:15px}
.row.atts{flex-wrap:wrap;gap:8px}
.phs{display:grid;gap:4px;margin:4px -6px 2px}
.phs.n2{grid-template-columns:1fr 1fr}.phs.n3{grid-template-columns:1fr 1fr 1fr}
.phs .ph{margin:0;min-width:0;min-height:90px}
.phs.n2 .ph img,.phs.n3 .ph img{height:120px;max-height:none}
.fl{display:flex;align-items:center;gap:8px;margin:6px 0 2px;padding:8px 10px;border-radius:12px;background:var(--fill);color:var(--ink);text-decoration:none;cursor:pointer;min-width:200px}
.fl i{font-style:normal;font-size:20px}
.fl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.fl em{font-style:normal;font-size:12px;color:var(--muted)}
.etx{width:100%;border:0;outline:none;background:none;padding:12px 16px;resize:vertical;font:inherit;color:inherit;min-height:100px}

/* таб-бар */
nav{flex:none;display:flex;background:var(--bar);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;font-size:11.5px;font-weight:500;color:var(--muted);position:relative}
nav button.on{color:var(--accent)}
nav svg{width:26px;height:26px}
nav .dot{position:absolute;top:2px;left:calc(50% + 6px);margin:0}

/* списки настроек */
.page{padding:6px 16px 30px}
.grp{background:var(--cell);border-radius:12px;overflow:hidden;margin:8px 0 22px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:46px;border-bottom:.5px solid var(--sep);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .l{flex:1;min-width:0}
.row .r{color:var(--muted);font-size:15px}
.row.act{color:var(--link)}
.row.del{color:var(--bad)}
.cap{font-size:13px;color:var(--muted);text-transform:uppercase;margin:0 16px 6px}
.note{font-size:13px;color:var(--muted);margin:-14px 16px 22px}
.row input[type=text],.row input[type=tel]{flex:1;min-width:0;border:0;outline:none;background:none;text-align:right}
.chk{width:22px;height:22px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:14px;margin:0 16px 12px}

/* бронь */
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.dchip{flex:none;min-width:52px;padding:6px 4px;border-radius:12px;background:var(--cell);text-align:center;font-size:12px;color:var(--muted);position:relative}
.dchip b{display:block;font-size:18px;color:var(--ink);line-height:1.2}
.dchip.on{background:var(--accent);color:#fff}.dchip.on b{color:#fff}
.dchip i{position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.dchip.on i{background:#fff}
.dpick{flex:none;display:flex;align-items:center;justify-content:center;min-width:52px;border-radius:12px;background:var(--cell);position:relative;font-size:20px}
.dpick input{position:absolute;inset:0;opacity:0;width:100%}
.bday{font-weight:600;margin:0 2px 8px;font-size:15px}
.hall{position:relative;width:100%;background:var(--cell);border-radius:14px;overflow:hidden;margin-bottom:22px}
.tb{position:absolute;border-radius:8px;border:1.5px solid #15803D;background:#6EDC8C;color:#000;padding:0;overflow:hidden;font-size:11px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;white-space:nowrap}
.tb.round{border-radius:50%;align-items:center;justify-content:center;text-align:center}
.tb.round b{font-size:9.5px}
.tb.wide{flex-direction:row;gap:5px}
.hall.loading .tb{opacity:.35}
.tb.busy{border-color:#C8102E;background:#FF8A9B}
.tb .bt{font-weight:700;font-size:10.5px;letter-spacing:-.5px}
.deco{position:absolute;background:var(--sep)}
.hl{position:absolute;font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.bkrow .tm2{font-weight:700;min-width:48px}
.sheet-bg{position:fixed;inset:0;background:var(--dim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow-y:auto}
.sheet h3{margin:4px 0 12px;font-size:20px}
.row input[type=time],.row input[type=number]{flex:1;border:0;outline:none;background:none;text-align:right;min-width:0}
.row.sw{justify-content:space-between}
.zpmain{padding:0;overflow:hidden}
.zpmain iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}

/* вход */
.login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;gap:16px;text-align:center}
.login img{width:84px;height:84px;border-radius:20px}
.login h2{margin:0;font-size:26px}
.login p{margin:0;color:var(--muted);font-size:15px}
.login input{width:200px;text-align:center;font-size:30px;letter-spacing:.3em;padding:10px;border-radius:12px;border:1px solid var(--sep);background:var(--cell);outline:none}
.login .bigbtn{flex:none;width:200px}

/* просмотр фото, тосты */
.viewer{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;color:#fff;font-size:17px;background:rgba(255,255,255,.18);padding:6px 14px;border-radius:16px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;z-index:60;max-width:88%;text-align:center}
.hint{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<input type="file" id="file" accept="image/*,application/pdf,.pdf,.doc,.docx,.xls,.xlsx,.txt,.csv" multiple hidden>
<input type="file" id="file2" accept="image/*,application/pdf,.pdf,.doc,.docx,.xls,.xlsx,.txt,.csv" multiple hidden>
<script>
"use strict";
const APP_VERSION = "12";
const CFG = self.CHAT_CFG || {};
const API = CFG.api;
const BARS = {"13":"13шка", epo:"ЕпО"};
const CHS = [["prob","Проблемы"]];   // приложение только для рабочих задач: «Вопросы» и «Смены» убраны
const MAX_FILES = 6, MAX_FILE_MB = 10;  // то же ограничение на сервере
const POLL_MS = 12000;         // опрос сервера, пока приложение открыто
const IC = {
  prob:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 15h3"/></svg>',
  zp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  clip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'
};
const isCh = c=>CHS.some(x=>x[0]===c);

/* ---------- хранилище ---------- */
const ls = { get(k,d){ try{ const v=localStorage.getItem("chat-"+k); return v==null?d:JSON.parse(v);}catch(_){return d;} },
             set(k,v){ try{ localStorage.setItem("chat-"+k,JSON.stringify(v)); return true; }catch(_){ return false; } } };
const st = {
  token: ls.get("token",""), me: ls.get("me",null), ver: ls.get("ver",0),
  msgs: new Map(), bar: ls.get("bar","13"), ch: ls.get("ch","prob"), view: "chat",
  seen: ls.get("seen",{}), people: [], online: true, draft: {}, atts: {}, users: null, edit: null, err: "",
  out: ls.get("out",[]),           // очередь неотправленных: переживает перезапуск
  books: [], bday: null, bedit: null, bookLoaded: {}, updReady: false
};
if(!isCh(st.ch)) st.ch="prob";
(ls.get("cache",[])||[]).forEach(m=>{ if(isCh(m.ch)) st.msgs.set(m.id,m); });
st.out.forEach(o=>st.msgs.set("t"+o.cid, tmpMsg(o)));

const esc = s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id=>document.getElementById(id);
const pad = n=>String(n).padStart(2,"0");
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2800); }
function plural(n,a,b,c){ n=Math.abs(n)%100; const k=n%10; return n>10&&n<20?c:k>1&&k<5?b:k===1?a:c; }
function uid(){ try{ return crypto.randomUUID().replace(/-/g,""); }catch(_){ return Date.now().toString(36)+Math.random().toString(36).slice(2); } }

/* ---------- сервер ---------- */
const ERR = {
  bad_pin:"Неверный PIN", auth:"Вход сброшен — войдите заново", forbidden:"Нет доступа",
  locked:"Слишком много неверных PIN. Вход закрыт на 15 минут — попробуйте позже",
  empty:"Напишите текст или прикрепите фото/файл", bad_photo:"Не удалось прочитать файл — выберите другой",
  bad_ch:"Этот раздел больше не работает — обновите приложение", bad_op:"Устаревшая версия приложения — обновите страницу",
  closed:"Проблема уже закрыта — изменить или удалить её нельзя", not_found:"Проблема не найдена"
};
function humanError(e){
  const m=String(e&&e.message||e||"");
  if(e&&e.name==="AbortError") return "Сервер не ответил вовремя. Проверьте интернет";
  if(e&&e.name==="TypeError"&&/fetch|network|load/i.test(m)) return "Нет связи с сервером. Проверьте интернет";
  if(ERR[m]) return ERR[m];
  if(/Service invoked too many times|Превышен|quota|Lock|timed out|Exception/i.test(m)) return "Сервер Google перегружен. Попробуйте через минуту";
  if(/^[a-z_]+$/.test(m)) return "Ошибка сервера ("+m+")";
  return m||"Неизвестная ошибка";
}
async function call(op, body, ms){
  if(!API) throw new Error("Приложение ещё не подключено к серверу");
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(), ms||25000);
  let j;
  try{
    const r = await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({op,token:st.token},body||{})),redirect:"follow",signal:ctl.signal});
    const t = await r.text();
    try{ j=JSON.parse(t); }catch(_){ const er=new Error("Сервер Google временно недоступен. Попробуйте через минуту"); er.plain=true; throw er; }
  }catch(e){ if(e.plain) throw e; const er=new Error(humanError(e)); er.net=true; throw er; }
  finally{ clearTimeout(timer); }
  if(!j.ok){
    if(j.error==="auth"){ logout(true); }
    throw new Error(humanError(j.error));
  }
  return j.data;
}

let syncing=false, firstSync=true;
async function sync(){
  if(!st.token||syncing) return;
  syncing=true;
  try{
    const d = await call("sync",{since:st.ver,withUsers:firstSync});
    firstSync=false;
    st.me=d.me; ls.set("me",d.me);
    if(!st.me.zp) forgetZp();
    if(d.people) st.people=d.people;
    if(st.me.bars.indexOf(st.bar)<0){ st.bar=st.me.bars[0]; }
    let fresh=false;
    d.msgs.forEach(m=>{ if(!isCh(m.ch)) return; dropTmp(m.cid); st.msgs.set(m.id,m); fresh=true; });
    // новый вход: старое не считаем непрочитанным
    if(!Object.keys(st.seen).length&&d.msgs.length){ d.msgs.forEach(m=>{ const k=key(m.bar,m.ch); st.seen[k]=Math.max(st.seen[k]||0,m.id); }); ls.set("seen",st.seen); }
    if(d.ver) st.ver=Math.max(st.ver,d.ver);
    setOnline(true);
    if(fresh){ save(); if(st.view==="chat") renderFeed(true); renderBadges(); }
    flushOut();
  }catch(e){ if(!/Вход сброшен/.test(e.message)) setOnline(false); }
  finally{ syncing=false; }
}
function save(){
  const arr=[...st.msgs.values()].filter(m=>!m.tmp).sort((a,b)=>a.id-b.id).slice(-600);
  ls.set("cache",arr); ls.set("ver",st.ver);
}
function setOnline(v){ if(st.online===v) return; st.online=v; const n=$("net"); if(n){ n.textContent=v?"":"нет связи"; n.className="net"+(v?"":" off"); } }

/* ---------- непрочитанное ---------- */
const key=(b,c)=>b+"_"+c;
function unread(b,c){
  if(!st.me) return 0;
  const s=st.seen[key(b,c)]||0; let n=0;
  for(const m of st.msgs.values()) if(m.bar===b&&m.ch===c&&m.id>s&&m.uid!==st.me.id&&!m.tmp&&m.status!=="del") n++;
  return n;
}
function markSeen(){
  let mx=0; for(const m of st.msgs.values()) if(m.bar===st.bar&&m.ch===st.ch&&!m.tmp) mx=Math.max(mx,m.id);
  if(mx>(st.seen[key(st.bar,st.ch)]||0)){ st.seen[key(st.bar,st.ch)]=mx; ls.set("seen",st.seen); renderBadges(); }
}
function renderBadges(){
  if(!st.me) return;
  CHS.forEach(([c])=>{ const el=document.querySelector('nav [data-ch="'+c+'"] .dot'); if(!el) return; const n=unread(st.bar,c); el.textContent=n; el.hidden=!n; });
  st.me.bars.forEach(b=>{ const el=document.querySelector('.seg [data-bar="'+b+'"] .dot'); if(!el) return; const n=b===st.bar?0:CHS.reduce((s,[c])=>s+unread(b,c),0); el.textContent=n; el.hidden=!n; });
  let tot=0; st.me.bars.forEach(b=>CHS.forEach(([c])=>tot+=unread(b,c)));
  try{ if(navigator.setAppBadge) tot?navigator.setAppBadge(tot):navigator.clearAppBadge(); }catch(_){}
}

const isImg = t=>/^image\//.test(t||"");
const fmtSize = n=>n>=1048576?(n/1048576).toFixed(1).replace(".",",")+" МБ":Math.max(1,Math.round(n/1024))+" КБ";
function attsHtml(list, act){
  return list.map((f,i)=>'<span class="att">'+(isImg(f.type)?'<img src="'+f.data+'" alt="">':'<i>📄</i>')+'<span class="an">'+esc(f.name)+'</span><button type="button" data-a="'+act+'" data-i="'+i+'" aria-label="Убрать">✕</button></span>').join("");
}
function composerHtml(){

const fmtDay = d=>{ const t=new Date(); const y=new Date(); y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString()) return "Сегодня"; if(d.toDateString()===y.toDateString()) return "Вчера";
  return d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",weekday:"short"}); };
const fmtTime = d=>pad(d.getHours())+":"+pad(d.getMinutes());

function statusChip(m){
  if(m.tmp) return '';
  const created = (()=>{ const d=new Date(m.ts); return pad(d.getDate())+"."+pad(d.getMonth()+1); })();
  if(m.status==="done") return '<span class="st done">✓ Решено</span>';
  if(m.status==="skip") return '<span class="st skip">Не нужно</span>';
  if(m.status==="gone") return '<span class="st gone">Убрано из дел</span>';
  if(m.note && m.note!==created) return '<span class="st moved">Перенесено на '+esc(m.note)+'</span>';
  return '<span class="st open">В списке дел</span>';
}
function probClass(m){ if(m.tmp) return ""; if(m.status==="done"||m.status==="skip"||m.status==="gone") return m.status; return ""; }
const canChange = m=>st.me&&!m.tmp&&m.status!=="del"&&(st.me.admin||(m.uid===st.me.id&&["done","skip","gone"].indexOf(m.status)<0));

function filesHtml(m){
  const list = m.tmp ? (m.localFiles||[]) : (m.files||[]);
  if(!list.length) return "";
  const imgs=list.filter(f=>isImg(f.type)), docs=list.filter(f=>!isImg(f.type));
  let h="";
  if(imgs.length) h+='<div class="phs n'+Math.min(imgs.length,3)+'">'+imgs.map(f=>f.data?'<a class="ph"><img src="'+f.data+'" alt=""></a>':'<a class="ph" data-ph="'+esc(f.id)+'"><div class="ld">Загрузка фото…</div></a>').join("")+'</div>';
  if(docs.length) h+=docs.map(f=>'<a class="fl"'+(f.id?' data-fid="'+esc(f.id)+'" data-fname="'+esc(f.name)+'"':'')+'><i>📄</i><span>'+esc(f.name)+'</span>'+(f.size?'<em>'+fmtSize(f.size)+'</em>':'')+'</a>').join("");
  return h;
}
function renderFeed(keepPos, toBottom){
  const f=$("feed"); if(!f) return;
  const nearBottom = f.scrollHeight - f.scrollTop - f.clientHeight < 120;
  const list=[...st.msgs.values()].filter(m=>m.bar===st.bar&&m.ch===st.ch&&m.status!=="del").sort((a,b)=>(a.tmp?1e15+new Date(a.ts).getTime():a.id)-(b.tmp?1e15+new Date(b.ts).getTime():b.id));
  if(!list.length){
    f.innerHTML='<div class="empty"><b>Проблем пока нет</b>Опишите проблему и при необходимости прикрепите фото или файл — она сразу попадёт в список дел помощника, а статус будет виден здесь.</div>';
    return;
  }
  let h="", lastDay="";
  list.forEach(m=>{
    const d=new Date(m.ts), dk=d.toDateString();
    if(dk!==lastDay){ h+='<div class="day"><span>'+esc(fmtDay(d))+'</span></div>'; lastDay=dk; }
    const mine=st.me&&m.uid===st.me.id;
    const cls="m"+(mine?" me":"")+(m.ch==="prob"?" prob "+probClass(m):"")+(m.tmp?" pend":"")+(m.fail?" fail":"");
    const tm = m.fail ? 'Не отправлено — нажмите, чтобы повторить' : m.tmp ? 'Отправка…' : fmtTime(d)+(canChange(m)?'<a data-a="edit" data-mid="'+m.id+'" href="#">изменить</a><a data-a="del" data-mid="'+m.id+'" href="#">удалить</a>':'');
    h+='<div class="'+cls+'" data-id="'+esc(m.id)+'"><div class="b">'+
      (!mine?'<div class="who">'+esc(m.name)+'</div>':'')+
      filesHtml(m)+
      (m.text?'<div class="tx">'+esc(m.text)+'</div>':'')+
      (m.ch==="prob"?statusChip(m):'')+
      '<div class="tm">'+tm+'</div></div></div>';
  });
  f.innerHTML=h;
  loadPhotos();
  if(toBottom||nearBottom||!keepPos) f.scrollTop=f.scrollHeight;
  markSeen();
}

/* ---------- фото ---------- */
const photoMem=new Map();
let io=null;
function loadPhotos(){
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); showPhoto(e.target); } }),{root:$("feed"),rootMargin:"400px"});
  document.querySelectorAll(".ph[data-ph]").forEach(el=>{ const id=el.dataset.ph; if(photoMem.has(id)) el.innerHTML='<img src="'+photoMem.get(id)+'" alt="">'; else io.observe(el); });
}
const PHOTO_KEEP=200;
async function trimPhotos(){ try{ const c=await caches.open("chat-photos"); const ks=await c.keys(); for(let i=0;i<ks.length-PHOTO_KEEP;i++) await c.delete(ks[i]); }catch(_){} }
async function getPhoto(id){
  if(photoMem.has(id)) return photoMem.get(id);
  let url=null;
  try{ const c=await caches.open("chat-photos"); const r=await c.match("p/"+id); if(r){ url=URL.createObjectURL(await r.blob()); } }catch(_){}
  if(!url){
    const data=await call("photo",{id},40000);
    const blob=await (await fetch(data)).blob();
    try{ const c=await caches.open("chat-photos"); await c.put("p/"+id,new Response(blob)); }catch(_){}
    url=URL.createObjectURL(blob);
  }
  photoMem.set(id,url); return url;
}
async function showPhoto(el){
  try{ const u=await getPhoto(el.dataset.ph); el.innerHTML='<img src="'+u+'" alt="">'; }
  catch(e){ el.innerHTML='<div class="ld">Фото не загрузилось</div>'; }
}
function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{ const max=1600; let w=img.naturalWidth,h=img.naturalHeight; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",0.8)); };
    img.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("Не удалось открыть фото")); };
    img.src=u;
  });
}
function viewer(src){ const d=document.createElement("div"); d.className="viewer"; d.innerHTML='<img src="'+src+'" alt=""><button>Закрыть</button>'; d.onclick=()=>d.remove(); document.body.appendChild(d); }

/* ---------- отправка: очередь, ключ от дублей, автоповтор ---------- */
function tmpMsg(o){ return {id:"t"+o.cid,cid:o.cid,tmp:true,ts:o.ts,bar:o.bar,ch:o.ch,uid:o.uid,name:o.name,text:o.text,localFiles:o.files||[],fail:!!o.fail}; }
function saveOut(){
  if(ls.set("out",st.out)) return;
  // не влезло (большие фото): сохраняем хотя бы тексты, фото останутся только до перезапуска
  ls.set("out",st.out.map(o=>Object.assign({},o,{files:[]})));
  toast("Вложения сохранятся до отправки, только пока приложение открыто");
}
function dropTmp(cid){
  if(!cid) return;
  st.msgs.delete("t"+cid);
  const n=st.out.length; st.out=st.out.filter(o=>o.cid!==cid); if(st.out.length!==n) saveOut();
}
function send(){
  const ta=$("txt"); const text=(ta?ta.value:"").trim(), k=key(st.bar,st.ch), files=st.atts[k]||[];
  if(!text&&!files.length) return;
  const o={cid:uid(),ts:new Date().toISOString(),bar:st.bar,ch:st.ch,uid:st.me.id,name:st.me.name,text,files};
  st.out.push(o); saveOut();
  st.msgs.set("t"+o.cid,tmpMsg(o)); st.draft[k]=""; delete st.atts[k];
  render(); renderFeed(false,true);
  flushOut(o.cid);
}
const inFlight=new Set();
let lastErrToast=0;
async function sendOne(o, manual){
  if(inFlight.has(o.cid)) return;
  inFlight.add(o.cid);
  const wasFail=!!o.fail;
  const m=st.msgs.get("t"+o.cid); if(m){ m.fail=false; }
  if(st.view==="chat") renderFeed(true);
  try{
    const fl=o.files||[];
    const r=await call("post",{bar:o.bar,ch:o.ch,text:o.text,files:fl.map(f=>({name:f.name,data:f.data})),cid:o.cid}, fl.length?90000:25000);
    (r.files||[]).forEach((f,i)=>{ const src=fl[i]; if(src&&isImg(f.type)) photoMem.set(f.id,src.data); });
    dropTmp(o.cid); st.msgs.set(r.id,r); save();
    if(r.ch==="prob") toast("Добавлено в список дел");
    setOnline(true);
  }catch(e){
    const mm=st.msgs.get("t"+o.cid); if(mm) mm.fail=true;
    const q=st.out.find(x=>x.cid===o.cid); if(q){ q.fail=true; saveOut(); }
    if((manual||!wasFail)&&Date.now()-lastErrToast>8000){ toast(e.message+(e.net?". Сообщение уйдёт само, когда появится связь":"")); lastErrToast=Date.now(); }
    if(e.net) setOnline(false);
  }finally{ inFlight.delete(o.cid); }
  if(st.view==="chat") renderFeed(true);
}
async function flushOut(manualCid){ for(const o of st.out.slice()) await sendOne(o, o.cid===manualCid); }
window.addEventListener("online",()=>{ setOnline(true); flushOut(); sync(); });

async function delMsg(id){
  const m=st.msgs.get(+id); if(!m) return;
  if(!confirm(m.ch==="prob"?"Удалить проблему? Она уберётся и из списка дел.":"Удалить сообщение?")) return;
  try{ const r=await call("del",{id:+id}); st.msgs.set(r.id,r); save(); renderFeed(true); renderBadges(); toast("Удалено"); }
  catch(e){ toast(e.message); }
}

function isoDay(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function addDays(iso,n){ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return isoDay(d); }

const bookLoading={};                 // загрузка отдельно по каждому бару
async function loadBook(silent){
  const bar=st.bar;
  if(!st.me||bookLoading[bar]) return; bookLoading[bar]=true;
  const today=isoDay(new Date()), from=addDays(today,-1), to=addDays(today,90);
  const f=st.bday<from?st.bday:from, t=st.bday>to?st.bday:to;
  try{ const r=await call("book_list",{bar,from:f,to:t}); st.books=st.books.filter(b=>b.bar!==bar).concat(r); st.bookLoaded[bar]=true; }
  catch(e){ if(!silent) toast(e.message); }
  finally{ bookLoading[bar]=false; if(st.view==="book"&&!$("sheet")) renderBook(); }
}
function dayBooks(){ return st.books.filter(b=>b.bar===st.bar&&b.date===st.bday); }

function tblName(t){ const pl=PLANS[st.bar], o=pl&&pl.tables.find(x=>x.id===t); if(o&&o.label) return o.label; if(/^\d+$/.test(t)) return o?"стол на "+o.seats:"стол"; return t; }
function hallHtml(p,list,loading){
  const pos=o=>'left:'+(o.x/p.W*100)+'%;top:'+(o.y/p.H*100)+'%;width:'+((o.w||0)/p.W*100)+'%;height:'+((o.h||0)/p.H*100)+'%';

  (p.labels||[]).forEach(l=>{ h+='<div class="hl" style="left:'+(l.x/p.W*100)+'%;top:'+(l.y/p.H*100)+'%">'+esc(l.t)+'</div>'; });
  p.tables.forEach(t=>{ const b=list.find(x=>x.tbl===t.id), named=!/^\d+$/.test(t.id);
    h+='<button class="tb'+(t.round?" round":"")+(named?" wide":"")+(b?" busy":"")+'" data-tbl="'+esc(t.id)+'" aria-label="'+esc(tblName(t.id))+(b?", занят":", свободен")+'" style="'+pos(t)+'">'+

        (named?'<b>'+esc(t.id)+'</b>':'')+(b?'<b class="bt">'+esc(b.time)+'</b>':'<span>'+esc(t.seats)+'</span>'))+'</button>'; });
  return h+'</div>';
}
// Мелкие столы трудно попасть пальцем: нажатие рядом со столом (в пределах 22 px) считается нажатием на ближайший стол.
function nearestTable(hall,x,y){
  let best=null, bd=22;
  hall.querySelectorAll(".tb").forEach(el=>{ const r=el.getBoundingClientRect();
    const dx=Math.max(r.left-x,0,x-r.right), dy=Math.max(r.top-y,0,y-r.bottom), d=Math.hypot(dx,dy);
    if(d<bd){ bd=d; best=el; } });
  return best;
}

const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
function pushState(){
  if(!(CFG.firebase&&CFG.firebase.apiKey&&CFG.vapidKey)) return "nocfg";
  if(isIOS&&!standalone) return "ios";
  if(!("Notification" in window)||!("serviceWorker" in navigator)) return "unsupported";
  if(Notification.permission==="denied") return "denied";
  if(Notification.permission==="granted"&&ls.get("push",false)) return "on";
  return "off";
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("Нет связи — не загрузился модуль уведомлений")); document.head.appendChild(s); }); }
let fbReady=null;
function firebaseInit(){
  if(!fbReady) fbReady=(async()=>{
    const FB="https://www.gstatic.com/firebasejs/10.12.2/";
    await loadScript(FB+"firebase-app-compat.js"); await loadScript(FB+"firebase-messaging-compat.js");
    if(!firebase.apps.length) firebase.initializeApp(CFG.firebase);
    const m=firebase.messaging(); m.onMessage(()=>sync()); return m;
  })().catch(e=>{ fbReady=null; throw e; });
  return fbReady;
}
async function registerPush(ask){
  if(ask){ const p=await Notification.requestPermission(); if(p!=="granted") throw new Error("Уведомления не разрешены"); }
  const m=await firebaseInit(); const reg=await navigator.serviceWorker.ready;
  const t=await m.getToken({vapidKey:CFG.vapidKey,serviceWorkerRegistration:reg});
  if(!t) throw new Error("Не удалось получить токен уведомлений");
  if(ask||ls.get("pushTok","")!==t){ await call("push_reg",{fcm:t}); ls.set("pushTok",t); }
  ls.set("push",true);
}

  }
  const data=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error("Не удалось прочитать «"+file.name+"»")); r.readAsDataURL(file); });
  return {name:file.name||"файл",type:file.type||"application/octet-stream",size:file.size,data};
}
async function addFiles(files, list, limit){
  let skipped=0;
  for(const f of files){
    if(list.length>=limit){ skipped++; continue; }
    try{ list.push(await readAtt(f)); }catch(err){ toast(err.message); }
  }
  if(skipped) toast("Не больше "+MAX_FILES+" вложений");
}
$("file").addEventListener("change",async e=>{
  const files=[...(e.target.files||[])]; e.target.value=""; if(!files.length) return;
  const k=key(st.bar,st.ch), list=st.atts[k]||(st.atts[k]=[]);
  await addFiles(files,list,MAX_FILES); if(!list.length) delete st.atts[k];
  render(); const ta=$("txt"); ta&&ta.focus();
});
$("file2").addEventListener("change",async e=>{
  const files=[...(e.target.files||[])]; e.target.value=""; if(!files.length||!st.ed) return;
  const d=st.ed;
  await addFiles(files,d.add,MAX_FILES-d.keep.length);
  renderEditAtts();
});

/* ---------- правка проблемы ---------- */
function openEdit(id){
  const m=st.msgs.get(+id); if(!m||!canChange(m)) return;
  closeEdit(true);
  st.ed={id:m.id, keep:(m.files||[]).map(f=>f.id), add:[], files:m.files||[]};
  const bg=document.createElement("div"); bg.className="sheet-bg"; bg.id="esheet";
  bg.innerHTML='<form class="sheet" id="eform"><h3>Изменить проблему</h3>'+
    '<div class="grp"><textarea name="text" rows="4" class="etx" placeholder="Описание проблемы">'+esc(m.text)+'</textarea></div>'+
    '<div class="cap">Вложения</div><div class="grp"><div class="row atts" id="eatts"></div><button class="row act" type="button" data-a="epick">+ Добавить фото или файл</button></div>'+
    '<div class="err" id="eerr"></div>'+
    '<div class="grp"><button class="row act" type="submit"><b>Сохранить</b></button></div>'+
    '<div class="grp"><button class="row" type="button" data-a="eclose">Отмена</button></div></form>';
  bg.addEventListener("click",ev=>{ if(ev.target===bg) closeEdit(); });
  document.body.appendChild(bg);
  renderEditAtts();
  bg.dataset.orig=editSig();
}
function renderEditAtts(){
  const d=st.ed, el=$("eatts"); if(!d||!el) return;
  const kept=d.files.filter(f=>d.keep.indexOf(f.id)>=0);
  el.innerHTML=(kept.map(f=>'<span class="att">'+(isImg(f.type)&&photoMem.has(f.id)?'<img src="'+photoMem.get(f.id)+'" alt="">':'<i>'+(isImg(f.type)?'🖼':'📄')+'</i>')+'<span class="an">'+esc(f.name)+'</span><button type="button" data-a="ekeep" data-fid="'+esc(f.id)+'" aria-label="Убрать">✕</button></span>').join("")+attsHtml(d.add,"eunatt"))||'<span class="r">Нет вложений</span>';
}
function editSig(){ const f=$("eform"), d=st.ed; return f&&d?f.text.value+"|"+d.keep.join(",")+"|"+d.add.length:""; }
function closeEdit(force){
  const s=$("esheet"); if(!s) return true;
  if(!force&&s.dataset.orig!==editSig()&&!confirm("Закрыть без сохранения?")) return false;
  s.remove(); st.ed=null; return true;
}
async function downloadFile(id,name){
  try{
    toast("Загрузка файла…");
    const data=await call("photo",{id},60000);
    const blob=await (await fetch(data)).blob(), url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name||"файл"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){ toast(e.message); }
}


async function logout(silent){
  const tok=st.token, fcm=ls.get("pushTok","");
  if(!silent&&tok&&fcm){ try{ await call("push_unreg",{fcm},4000); }catch(_){} }
  st.token=""; st.me=null; st.msgs.clear(); st.ver=0; st.seen={}; st.out=[]; st.books=[]; st.bookLoaded={}; st.atts={}; st.draft={}; st.ed=null;
  ["token","me","cache","ver","seen","push","pushTok","out"].forEach(k=>{ try{ localStorage.removeItem("chat-"+k); }catch(_){} });
  forgetZp();
  try{ await caches.delete("chat-photos"); }catch(_){}
  photoMem.clear();
  if(silent) st.err="Вход сброшен — войдите заново";
  closeSheet(true);
  render();
}

function openLink(h){
  const m=/#(prob|ask|book)-(13|epo)/.exec(h||""); if(!m||!st.me) return; const view=m[1]==="ask"?"prob":m[1];
  if(st.me.bars.indexOf(m[2])>=0){ st.bar=m[2]; ls.set("bar",st.bar);
    if(view==="book"){ st.view="book"; render(); loadBook(); } else { st.ch=view; st.view="chat"; ls.set("ch",st.ch); render(); } }
  try{ history.replaceState(null,"",location.pathname); }catch(_){}
}
window.addEventListener("hashchange",()=>openLink(location.hash));
if(navigator.serviceWorker) navigator.serviceWorker.addEventListener("message",e=>{ if(e.data&&e.data.type==="open"){ openLink(e.data.link); sync(); } });

/* ---------- обновление приложения ---------- */
// Не перезагружаем, пока человек что-то вводит или есть неотправленное — показываем плашку.
function busyNow(){ return !!$("sheet")||!!$("esheet")||!!st.edit||st.out.length>0||Object.keys(st.atts).length>0||Object.values(st.draft).some(v=>v&&v.trim()); }
async function checkVersion(){
  try{ const t=(await fetch("version.txt?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"")).trim();
    if(!t||t===APP_VERSION) return;
    if(busyNow()){ if(!st.updReady){ st.updReady=true; const hd=document.querySelector("header"); if(hd&&!hd.querySelector(".upd")) hd.insertAdjacentHTML("beforeend",'<button class="upd" data-a="reload">Доступна новая версия приложения — нажмите, чтобы обновить</button>'); } }
    else location.reload();
  }catch(_){}
}

/* ---------- старт ---------- */
render();
openLink(location.hash);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
if(st.token){ sync(); if(pushState()==="on") registerPush(false).catch(()=>{}); }
setInterval(()=>{ if(document.visibilityState==="visible") sync(); },POLL_MS);
setInterval(()=>{ if(document.visibilityState==="visible"&&st.view==="book"&&!$("sheet")) loadBook(true); },30000);
setInterval(()=>{ if(st.out.length&&navigator.onLine!==false) flushOut(); },20000);
setTimeout(trimPhotos,5000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ sync(); checkVersion(); } });
</script>
</body>
</html>
